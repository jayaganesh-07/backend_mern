<script>
   // Find all pairs whose sum is an even number
let arr = [2, 5, 7, 4, 8, 3]

for (let a = 0; a <= arr.length - 1; a++) {

    for (let b = a + 1; b <= arr.length - 1; b++) {

        let sum = arr[a] + arr[b]

        if (sum % 2 == 0) {
            console.log(arr[a] + " + " + arr[b] + " = " + sum)
        }
    }
}



// Output
// 2 + 4 = 6
// 2 + 8 = 10
// 5 + 7 = 12
// 5 + 3 = 8
// 7 + 3 = 10
// 4 + 8 = 12
// Explanation
// Outer loop takes the first number.
// Inner loop takes the next numbers.
// sum = arr[a] + arr[b] adds both numbers.
// sum % 2 == 0 checks whether the sum is even.
// If the condition is true, the pair and sum are printed.
// b = a + 1 prevents checking the same pair again.
</script>
